<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LexFinder KZ — поиск по Трудовому кодексу РК</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#5f6b7a; --accent:#1f6feb; --border:#d8dee4; --warn:#9a6700; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --card:#1d232b; --fg:#e6e9ee; --muted:#9aa6b4; --accent:#58a6ff; --border:#333c47; --warn:#e3b341; --err:#ff7b72; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 320px; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--fg); font-size:1rem; }
  select, button { padding:12px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--fg); font-size:1rem; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .examples { margin:10px 0 0; font-size:.9rem; color:var(--muted); }
  .examples a { color:var(--accent); cursor:pointer; margin-right:10px; text-decoration:underline; }
  .status { margin:16px 0 8px; font-size:.9rem; color:var(--muted); }
  .banner { margin:12px 0; padding:10px 12px; border-radius:8px; border:1px solid var(--warn); color:var(--warn); font-size:.9rem; }
  .error { margin:12px 0; padding:10px 12px; border-radius:8px; border:1px solid var(--err); color:var(--err); }
  .hit { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin:10px 0; }
  .hit h2 { margin:0 0 2px; font-size:1.05rem; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:6px; }
  .snippet { margin:0; font-size:.95rem; }
  footer { margin-top:28px; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1>LexFinder KZ</h1>
  <p class="sub">Задайте вопрос по трудовому праву — система найдёт наиболее подходящие статьи Трудового кодекса РК.</p>
  <form id="f">
    <input id="q" type="text" maxlength="500" placeholder="Например: как предоставляется ежегодный оплачиваемый отпуск?" autocomplete="off" required>
    <select id="k" aria-label="Сколько статей показать"><option>3</option><option selected>5</option><option>10</option></select>
    <button id="go" type="submit">Найти</button>
  </form>
  <div class="examples">Примеры:
    <a data-q="Как оплачивается работа ночью?">работа ночью</a>
    <a data-q="Можно ли отозвать работника из отпуска?">отзыв из отпуска</a>
    <a data-q="Что такое дистанционная работа?">дистанционная работа</a>
  </div>
  <div id="banner"></div>
  <div id="status" class="status"></div>
  <div id="out"></div>
  <footer>Прототип. Результат — справочная подсказка, не юридическая консультация. Проверяйте актуальную редакцию кодекса.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

fetch('health').then(r => r.json()).then(h => {
  if (h.degraded) $('banner').innerHTML = '<div class="banner">Работает упрощённый режим (BM25 без нейросетевой модели): точность ниже обычной.</div>';
}).catch(() => {});

document.querySelectorAll('.examples a').forEach(a => a.onclick = () => { $('q').value = a.dataset.q; $('f').requestSubmit(); });

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value, k = parseInt($('k').value, 10);
  $('go').disabled = true; $('out').innerHTML = ''; $('status').textContent = 'Ищу…';
  try {
    const r = await fetch('search', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ query: q, top_k: k }) });
    const data = await r.json();
    if (!r.ok) {
      const d = Array.isArray(data.detail) ? data.detail.map(x => x.msg).join('; ') : data.detail;
      $('out').innerHTML = '<div class="error">' + esc(d || 'Ошибка запроса') + '</div>'; $('status').textContent = ''; return;
    }
    $('status').textContent = 'Режим: ' + (data.mode === 'hybrid' ? 'гибрид BM25 + BGE-M3' : 'BM25 (упрощённый)') + ' · ' + data.latency_ms + ' мс · версия модели ' + data.model_version;
    let html = '';
    if (data.no_lexical_match) html += '<div class="banner">В запросе нет слов, встречающихся в статьях: результаты менее надёжны, попробуйте переформулировать.</div>';
    html += data.results.map(h => '<div class="hit"><h2>' + h.rank + '. Статья ' + esc(h.article_number) + '. ' + esc(h.title) + '</h2><div class="meta">' + esc(h.chapter) + ' · релевантность ' + h.score + '</div><p class="snippet">' + esc(h.snippet) + '…</p></div>').join('');
    $('out').innerHTML = html;
  } catch (err) {
    $('out').innerHTML = '<div class="error">Сервис недоступен. Попробуйте позже.</div>'; $('status').textContent = '';
  } finally { $('go').disabled = false; }
});
</script>
</body>
</html>
